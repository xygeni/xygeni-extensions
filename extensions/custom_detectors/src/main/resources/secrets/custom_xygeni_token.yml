# Example secrets detector for Xygeni access tokens

# Detector for opaque tokens (user / organization)
id: xygeni_opaque_token
enabled: yes
type: apikey

description: Xygeni.io user / organization token

severity: high
confidence: high

value:
  regex:
    # Access token starts with xyo_ or xyu_ prefixes
    pattern: '(xyo_|xyu_)[a-zA-Z0-9]{64}'
    ignorecase: no
    exact: yes

verifier:
  enabled: yes
  className: com.depsdoctor.secrets.scanner.detector.verifier.ApiVerifier
  # action: do_nothing | ignore_when_not_verified | set_info_when_not_verified | increase_severity_when_verified | decrease_severity_when_not_verified
  action: set_info_when_not_verified
  properties:
    host: https://api.xygeni.io/token/self
    tokenPrefix: Bearer

remediation:
  enabled: yes
  on: scan, guardrail
  description: Revokes a Xygeni.io token using the self-revoke API.

  # Invoke the self-revoke endpoint
  playbook: |
    token = secret.decrypt(issue);
    require exists(token);
    api(
      'https://api.xygeni.io', 'DELETE', '/token/revoke/self', 
      headers = {'Authorization': 'Bearer ' + token} 
    );

---
# Detector for the legacy JWT
id: xygeni_token
enabled: yes
type: jwt

description: Xygeni.io token

severity: high
confidence: high
classname: XygeniJwtDetector

verifier:
  className: com.depsdoctor.secrets.scanner.detector.verifier.XygeniJwtVerifier
  # action: do_nothing | increase_severity_when_verified | decrease_severity_when_not_verified | ignore_when_not_verified
  action: decrease_severity_when_not_verified

value:
  regex:
    # Starts with xya_ + base64-encoded JTW token
    pattern: 'xya_eyJ[A-Za-z0-9-_=]+\.[A-Za-z0-9-_=]+\.?[A-Za-z0-9-_.+/=]*'
    ignorecase: no
    exact: true
  minEntropy: 3
