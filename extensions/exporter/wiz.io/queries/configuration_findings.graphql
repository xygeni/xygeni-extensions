# Wiz CNAPP configuration findings (CSPM policy violations against cloud resources).
#
# Every field below is confirmed present in a real tenant response, so the previously conservative
# selection has been restored. In particular `resolutionReason` and `note { text }` do exist (they
# come back null while a finding is open), as do `analyzedAt` and `totalCount`.
#
# `targetExternalId` is selected deliberately and must not be dropped: it is the provider-assigned
# identifier of the object the rule evaluated, it is present on every finding — including those
# whose resource has no `providerId` — and it anchors the flaw's identity. See IacFlaw.targetId.
query ListConfigurationFindings($first: Int, $after: String, $filterBy: ConfigurationFindingFilters, $orderBy: ConfigurationFindingOrder) {
  configurationFindings(first: $first, after: $after, filterBy: $filterBy, orderBy: $orderBy) {
    pageInfo { hasNextPage endCursor }
    totalCount
    nodes {
      id
      severity
      result
      status
      remediation
      analyzedAt
      updatedAt
      firstSeenAt
      resolutionReason
      targetExternalId
      targetObjectProviderUniqueId
      resource {
        id
        providerId
        name
        type
        nativeType
        region
        cloudPlatform
        status
        tags {
          key
          value
        }
        subscription {
          id
          name
          externalId
          cloudProvider
        }
        projects {
          id
          name
          riskProfile {
            businessImpact
          }
        }
      }
      rule {
        id
        graphId
        name
        description
        remediationInstructions
        functionAsControl
      }
      securitySubCategories {
        id
        title
        category {
          id
          name
          framework {
            id
            name
          }
        }
      }
      note {
        text
      }
    }
  }
}
