# Wiz CNAPP cloud asset inventory.
#
# Uses cloudResourcesV2: v1 `cloudResources` is deprecated, and its `CloudResourceFilters` has no
# `status` field. Note the v2 filter grammar takes objects — `type: {equals: [...]}` — not the bare
# arrays v1 accepted.
#
# Per-resource attributes are NOT flat fields on the node. Four independent integrations (Cortex
# XSOAR, Netskope, Infoblox's CloudQuery source, and Wiz's own CSV export) all route them through
# a JSON `properties` bag on the graph entity, so region, status, tags and exposure flags are read
# from `graphEntity.properties` rather than selected individually.
#
# UNVALIDATED: unlike the other three queries, this one has never run against a live tenant — no
# public integration queries v1 `cloudResources` successfully and Steampipe has no cloud-resources
# table at all. Confirm by introspection before relying on it.
query ListCloudResources($first: Int, $after: String, $filterBy: CloudResourceV2Filters) {
  cloudResourcesV2(first: $first, after: $after, filterBy: $filterBy) {
    pageInfo { hasNextPage endCursor }
    totalCount
    nodes {
      id
      name
      type
      subscriptionId
      subscriptionExternalId
      cloudAccount {
        id
        externalId
        name
        cloudProvider
      }
      graphEntity {
        id
        providerUniqueId
        name
        type
        properties
        firstSeen
        lastSeen
        projects {
          id
          name
        }
      }
    }
  }
}
