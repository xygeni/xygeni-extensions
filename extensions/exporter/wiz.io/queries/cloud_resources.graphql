# Wiz CNAPP cloud asset inventory.
#
# Usage:
#   python wiz_cnapp_exporter.py -c wiz.config --cloud-resources
#
# Variables:
#   first    Number of results per page (max 500)
#   after    Cursor for pagination, supplied by the exporter
#   filterBy CloudResourceV2Filters — type and status come from the [cloud_resources] config
#            section. Note the v2 grammar takes objects, `type: {equals: [...]}`, rather than
#            the bare arrays the other filters use.
#
# Per-resource attributes such as region, status, tags and exposure flags are not flat fields on
# the node: they arrive inside the JSON `properties` bag on `graphEntity`.
query ListCloudResources($first: Int, $after: String, $filterBy: CloudResourceV2Filters) {
  cloudResourcesV2(first: $first, after: $after, filterBy: $filterBy) {
    pageInfo { hasNextPage endCursor }
    totalCount
    nodes {
      id
      name
      type
      subscriptionId
      subscriptionExternalId
      cloudAccount {
        id
        externalId
        name
        cloudProvider
      }
      graphEntity {
        id
        providerUniqueId
        name
        type
        properties
        firstSeen
        lastSeen
        projects {
          id
          name
        }
      }
    }
  }
}
